<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Nada Mamdouh</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="form-page">
    <div class="form-overlay">
        <nav class="navbar navbar-dark">
            <a class="navbar-brand logo" href="index.html">NADA MAMDOUH</a>
        </nav>
        <div class="form-box">
            <h2>Sign In</h2>
            <form>
                <input type="email" class="form-control" placeholder="Email or phone number" required>
                <input type="password" class="form-control" placeholder="Password" required>
                <button type="submit" class="form-button">Sign In</button>
                <div class="form-options">
                    <label><input type="checkbox"> Remember me</label>
                    <a href="#">Need help?</a>
                </div>
            </form>
            <p class="form-note">New to Netflix? <a href="register.html">Sign up now</a>.</p>
            <p class="small-note">This page is a front-end design for a university task.</p>
        </div>
    </div>
</body>
</html>
