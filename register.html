<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration | Nada Mamdouh</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="form-page">
    <div class="form-overlay">
        <nav class="navbar navbar-dark">
            <a class="navbar-brand logo" href="index.html">NADA MAMDOUH</a>
            <a href="login.html" class="btn sign-btn">Sign In</a>
        </nav>
        <div class="form-box">
            <h2>Create Account</h2>
            <form>
                <input type="text" class="form-control" placeholder="Full Name" required>
                <input type="email" class="form-control" placeholder="Email Address" required>
                <input type="password" class="form-control" placeholder="Add a Password" required>
                <input type="password" class="form-control" placeholder="Confirm Password" required>
                <button type="submit" class="form-button">Register</button>
            </form>
            <p class="form-note">Already have an account? <a href="login.html">Sign in now</a>.</p>
            <p class="small-note">This page is a front-end design for a university task.</p>
        </div>
    </div>
</body>
</html>
